[project]
name = "forgetmenot"
version = "0.1.0"
description = "A small, self-hosted memory for things worth coming back to."
requires-python = ">=3.12"
dependencies = [
  "cryptography>=46,<47",
  "fastapi>=0.119,<1",
  "httpx>=0.28,<1",
  "PyJWT>=2.10,<3",
  "uvicorn>=0.37,<1",
]

[project.scripts]
forgetmenot = "forgetmenot.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forgetmenot"]
